<!-- ==============================================================
     VIEW: REKAP PRESENSI SISWA BULANAN (views/presensi/rekap.html)
     ============================================================== -->
<section id="view-absensi" class="app-view space-y-5">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h2 class="text-xl font-extrabold text-slate-900">Rekapitulasi Absensi Siswa Bulanan</h2>
            <p class="text-xs text-slate-500 mt-0.5">Pemantauan matriks presensi siswa per kelas per tanggal kalender pendidikan.</p>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="Router.navigate('presensi/harian')" class="px-3.5 py-2 bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 rounded-xl text-xs font-semibold inline-flex items-center gap-2 transition">
                <i class="fa-solid fa-clipboard-check text-blue-600"></i> Presensi Harian
            </button>
        </div>
    </div>

    <!-- Sub-tab Navigation Bar with Modular Vue 3 -->
    <div id="vue-absensi-tabs"
        class="bg-slate-200/80 p-1 rounded-xl flex items-center gap-1 overflow-x-auto shadow-inner">
        <button v-for="tab in visibleTabs" 
            :key="tab.id"
            type="button" 
            :data-abs-tab="tab.id"
            @click="switchTab(tab.id)"
            :class="['px-3.5 py-1.5 rounded-lg text-xs font-bold transition inline-flex items-center gap-1.5 whitespace-nowrap cursor-pointer', currentTab === tab.id ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-600 hover:text-slate-900']">
            <i :class="['fa-solid', tab.icon]"></i>
            <span>{{ tab.label }}</span>
        </button>
    </div>

    <!-- Container Rekap Siswa (Rendered dynamically by ModulPresensi.renderSiswaView) -->
    <div id="abs-tab-siswa" class="space-y-4"></div>

    <!-- Hidden tab containers for dynamic switching -->
    <div id="abs-tab-harian" class="space-y-5 hidden"></div>
    <div id="abs-tab-tendik" class="space-y-4 hidden"></div>
    <div id="abs-tab-qr" class="space-y-4 hidden"></div>
</section>
