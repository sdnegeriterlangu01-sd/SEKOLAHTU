# ============================================================================
# SEKOLAHTU — NETLIFY SERVERLESS CONFIGURATION
# SD Negeri Terlangu 01 Brebes
# ============================================================================

[build]
  publish = "."

[[redirects]]
  from = "/permohonan"
  to = "/permohonan.html"
  status = 200

[[redirects]]
  from = "/verifikasi"
  to = "/verifikasi.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"

