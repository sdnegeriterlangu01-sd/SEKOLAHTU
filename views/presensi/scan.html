<!-- ==============================================================
     VIEW: SCAN PRESENSI MANDIRI QR & BARCODE (views/presensi/scan.html)
     ============================================================== -->
<section id="view-scan-absensi" class="app-view space-y-5">
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
            <h2 class="text-xl font-extrabold text-slate-900 flex items-center gap-2">
                <i class="fa-solid fa-qrcode text-indigo-600"></i> Scan Presensi Mandiri (QR & Barcode)
            </h2>
            <p class="text-xs text-slate-500 mt-0.5">Scan kartu barcode / QR untuk presensi datang dan pulang otomatis tanpa repot membuka sub-tab.</p>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="Router.navigate('presensi/harian')" class="px-3.5 py-2 bg-white hover:bg-slate-50 border border-slate-300 text-slate-700 rounded-xl text-xs font-semibold inline-flex items-center gap-2 transition">
                <i class="fa-solid fa-clipboard-check text-blue-600"></i> Presensi Harian
            </button>
        </div>
    </div>
    
    <!-- Container scanner yang diisi oleh ModulPresensi.renderScanView() -->
    <div id="view-scan-container" class="space-y-4"></div>
</section>
